[package]
name = "property-ai-workspace"
version = "0.1.0"
description = "AI-powered real estate workspace"
authors = ["Property AI Workspace"]
edition = "2021"

[lib]
name = "property_ai_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
